<html>
  <head>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scorecard">
      <div class="container">
        <div>
          <h3>HOME</h3>
          <p id="home-score" class="score"></p>
          <button id="home-two" class="btn">+2</button>
          <button id="home-three" class="btn">+3</button>
          <button id="home-five" class="btn">+5</button>
          <button id="home-seven" class="btn">+5</button>
        </div>
        <div>
          <h3>AWAY</h3>
          <p id="away-score" class="score"></p>
          <button id="away-two" class="btn">+2</button>
          <button id="away-three" class="btn">+3</button>
          <button id="away-five" class="btn">+5</button>
          <button id="away-seven" class="btn">+5</button>
        </div>
      </div>
      <div class="score-ref">
        <p>Try: +5, Conversion: +2, Penalty Kick: +3</p>
        <p>Drop Goal: +3, Penalty Try: +7</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
